<header class="site-header" id="siteHeader">
  <div class="wrap header__inner">

    <a class="brand" href="#top" aria-label="Bright Saplings Daycare, back to top">
      <!-- THE FULL BADGE. Not a crop of it.
           I twice argued for using only the illustration here, on the grounds
           that the badge's own wordmark is unreadable at header size. That
           was answering a question nobody asked: the client wants their
           logo on their site, whole. It is 64px and the wordmark inside it
           is small — that is what a logo looks like in a header, and the
           name is set in real type right beside it anyway. -->
      <img class="brand__logo" src="images/logo.png" alt=""
           width="560" height="560" fetchpriority="high">
      <span class="brand__text">Bright Saplings<span class="brand__sub">Daycare</span></span>
    </a>

    <nav class="nav" id="primaryNav" aria-label="Primary">
      <ul class="nav__list">
        <li><a class="nav__link" href="#about">About</a></li>
        <li><a class="nav__link" href="#story">Our story</a></li>
        <li><a class="nav__link" href="#programs">Programs</a></li>
        <li><a class="nav__link" href="#activities">Activities</a></li>
        <li><a class="nav__link" href="#food">Food</a></li>
        <li><a class="nav__link" href="#location">Location</a></li>
      </ul>
      <a class="btn btn--peach btn--sm nav__cta" data-magnetic href="#contact">Book a tour</a>
    </nav>

    <button class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="primaryNav" aria-label="Open menu">
      <span class="nav-toggle__bar"></span>
      <span class="nav-toggle__bar"></span>
      <span class="nav-toggle__bar"></span>
    </button>

  </div>
  <div class="scroll-progress" id="scrollProgress" aria-hidden="true"></div>
</header>

<div class="nav-scrim" id="navScrim" hidden></div>
