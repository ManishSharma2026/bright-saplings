<!-- ============================================================
     BEFORE YOU GO LIVE
     Replace every occurrence of https://www.brightsaplings.com/
     with your real domain. It appears 4 times in this file, once
     in sitemap.xml and once in robots.txt. That is the only edit
     the domain needs.
     ============================================================ -->

<title>Bright Saplings Daycare | In-Home Childcare in Bothell, WA</title>
<meta name="description" content="Bright Saplings Daycare is an in-home childcare program in Bothell, WA for children 18 months to 5 years. Small class sizes, home-cooked meals and play-based learning. Reach us at 425-428-9660 to book a tour.">
<link rel="canonical" href="https://www.brightsaplings.com/">

<!-- Structured data. This is what puts the hours, phone number and
     ages into a Google result rather than just a blue link. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ChildCare",
  "name": "Bright Saplings Daycare",
  "slogan": "Growing bright minds, one child at a time",
  "description": "In-home childcare in Bothell, WA for children 18 months to 5 years. Small class sizes, meals cooked fresh each day by a trained baker, careful allergy handling, play-based learning and daily outdoor play.",
  "url": "https://www.brightsaplings.com/",
  "logo": "https://www.brightsaplings.com/images/logo.png",
  "image": "https://www.brightsaplings.com/images/og-image.jpg",
  "telephone": "+1-425-428-9660",
  "priceRange": "$$",
  "address": {
    "@type": "PostalAddress",
    "addressLocality": "Bothell",
    "addressRegion": "WA",
    "addressCountry": "US"
  },
  "areaServed": [
    { "@type": "City", "name": "Bothell" },
    { "@type": "City", "name": "Mill Creek" },
    { "@type": "City", "name": "Woodinville" },
    { "@type": "City", "name": "Kenmore" }
  ],
  "openingHoursSpecification": [{
    "@type": "OpeningHoursSpecification",
    "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
    "opens": "08:00",
    "closes": "18:00"
  }],
  "audience": {
    "@type": "PeopleAudience",
    "suggestedMinAge": 1.5,
    "suggestedMaxAge": 5
  }
}
</script>
